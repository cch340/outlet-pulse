name: Supabase keep-alive

# Supabase pauses Free plan projects after 7 days without user database
# activity. A real PostgREST query counts as activity, so this runs daily to
# keep the inactivity window from ever filling up.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       e.g. https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  the anon/publishable key (same one the client bundle ships)
#
# Caveat: GitHub disables scheduled workflows in repos with no commits for 60
# days, and emails the repo admins when it does. If this repo goes quiet that
# long, re-enable the workflow from the Actions tab.

on:
  schedule:
    - cron: '17 3 * * *' # daily at 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets must be set."
            exit 1
          fi

          # RLS scopes every table by owner_id = auth.uid(), so an unauthenticated
          # request returns zero rows — that is fine. What matters is that the
          # query reaches Postgres and registers as database activity.
          url="${SUPABASE_URL%/}/rest/v1/brands?select=id&limit=1"

          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 30 -o /tmp/keepalive-body.txt -w '%{http_code}' \
              "$url" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Accept: application/json") || code="000"

            if [ "$code" = "200" ]; then
              echo "Keep-alive query succeeded (HTTP $code)."
              exit 0
            fi

            echo "Attempt $attempt failed (HTTP $code): $(cat /tmp/keepalive-body.txt 2>/dev/null)"

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Supabase keep-alive query failed after 3 attempts (last HTTP $code)."
          exit 1
